<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
/* The legacy "Normal Sub Ledger - Detail - Posting Detail", reproduced point for
   point. Nothing here lays anything out: every run of text arrives with its own
   position, worked out in general_ledger_posting_detail.py from the coordinates
   of the legacy PDF. This sheet only draws them. */
@font-face {
  font-family: "Carlito"; font-weight: 400; font-style: normal;
  src: url(data:application/x-font-ttf;base64,{{ font_regular }}) format("truetype");
}
@font-face {
  font-family: "Carlito"; font-weight: 700; font-style: normal;
  src: url(data:application/x-font-ttf;base64,{{ font_bold }}) format("truetype");
}
@page { size: {{ page_w }}pt {{ page_h }}pt; margin: 0; }
/* wkhtmltopdf's page margins: frappe's get_pdf reads them from .print-format,
   and what it reads there overrides the options it was handed. */
.print-format { margin-top: 0mm; margin-bottom: 0mm; margin-left: 0mm; margin-right: 0mm; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Carlito", "Calibri", sans-serif;
  color: #000;
  /* widths must be the plain sum of advances, as the wrap was computed */
  font-kerning: none;
  font-variant-ligatures: none;
  font-feature-settings: "kern" 0, "liga" 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.sheet { position: relative; width: {{ page_w }}pt; height: 841pt; overflow: hidden; page-break-after: always; }
.sheet.last { page-break-after: auto; }
.t { position: absolute; white-space: pre; line-height: 1; font-weight: 400; }
.t.b { font-weight: 700; }
.t.g { color: {{ grey }}; }
.rule { position: absolute; left: 21.6pt; width: 559.4pt; }
.box { position: absolute; left: 21.6pt; width: 559.4pt; border: 0.8pt solid #000; box-sizing: border-box; }
</style>
</head>
<body>
{%- for items in sheets %}
<div class="sheet{% if loop.last %} last{% endif %}">
{%- for i in items %}
{%- if i.kind == "text" %}
{%- if i.align == "r" %}
<div class="t{% if i.bold %} b{% endif %}{% if i.grey %} g{% endif %}" style="right:{{ (page_w - i.x)|round(2) }}pt;top:{{ i.top }}pt;font-size:{{ i.size }}pt">{{ i.text }}</div>
{%- else %}
<div class="t{% if i.bold %} b{% endif %}{% if i.grey %} g{% endif %}" style="left:{{ i.x|round(2) }}pt;top:{{ i.top }}pt;font-size:{{ i.size }}pt">{{ i.text }}</div>
{%- endif %}
{%- elif i.kind == "rule" %}
<div class="rule" style="top:{{ (i.y - i.w / 2)|round(2) }}pt;height:{{ i.w }}pt;background:{{ i.colour }}"></div>
{%- elif i.kind == "box" %}
<div class="box" style="top:{{ i.top }}pt;height:{{ i.height }}pt"></div>
{%- endif %}
{%- endfor %}
</div>
{%- endfor %}
</body>
</html>
