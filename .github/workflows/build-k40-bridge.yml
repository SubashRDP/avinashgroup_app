name: Build K40 Bridge EXE

on:
  push:
    paths:
      - 'k40_bridge/**'
      - '.github/workflows/build-k40-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 32-bit build so the HTMS DB reader can use the Jet OLEDB 4.0 provider
          # that ships with every Windows (the same one HTMS-86 itself uses),
          # without requiring the Access Database Engine redistributable.
          architecture: 'x86'

      - name: Install dependencies
        # `python -m pip` so packages land in the same interpreter PyInstaller
        # uses. CRITICAL: PowerShell does NOT fail a step when a non-final native
        # command exits non-zero, so a failed `pip install -r` here would be
        # silently swallowed (it was — every exe shipped with no third-party
        # deps). Check $LASTEXITCODE after the requirements install so a failure
        # actually fails the build instead of producing a depless exe.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r k40_bridge/requirements.txt
          if ($LASTEXITCODE -ne 0) { Write-Error "requirements install failed"; exit 1 }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { Write-Error "pyinstaller install failed"; exit 1 }

      - name: Verify dependencies are importable (fail fast)
        run: python k40_bridge/ci_check_deps.py

      - name: Build EXE
        # Run PyInstaller via `python -m` (same interpreter as above) and
        # explicitly collect every third-party package. requests/zk are pure
        # Python (auto-detected once installed) but we collect them anyway as a
        # belt-and-suspenders guard; cryptography/cffi/certifi carry binaries and
        # data files PyInstaller can miss without --collect-all.
        run: |
          python -m PyInstaller --onefile --noconsole --name k40_bridge `
            --collect-all requests `
            --collect-all urllib3 `
            --collect-all certifi `
            --collect-all charset_normalizer `
            --collect-all idna `
            --collect-all cryptography `
            --collect-all cffi `
            --collect-submodules zk `
            --collect-all pystray `
            --collect-all PIL `
            --collect-all sv_ttk `
            --hidden-import=requests `
            --hidden-import=zk `
            --hidden-import=pystray._win32 `
            --hidden-import=PIL._imaging `
            --hidden-import=win32com `
            --hidden-import=win32com.client `
            --hidden-import=pythoncom `
            --hidden-import=pywintypes `
            k40_bridge/k40_bridge.py

      - name: Build Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" k40_bridge/installer.iss
        continue-on-error: true

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: k40_bridge
          path: dist/k40_bridge.exe

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: K40BridgeSetup
          path: k40_bridge/Output/K40BridgeSetup.exe
        continue-on-error: true

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(head -1 k40_bridge/latest_version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Create / update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k40-v${{ steps.version.outputs.version }}
          name: K40 Bridge v${{ steps.version.outputs.version }}
          body: |
            Download `K40BridgeSetup.exe` below and run it on the Windows machine.
            See `k40_bridge/README.md` for setup instructions.

            Server endpoints this bridge uses:
              - `…/avinashgroup_app.biometric.api.receive_attendance` (batched punch ingest)
              - `…/avinashgroup_app.biometric.heartbeat.ping` (every-cycle liveness)
              - `…/avinashgroup_app.biometric.bridge_commands.poll_commands` (Force Sync tunnel)
              - `…/avinashgroup_app.biometric.bridge_commands.report_command_result`

            Each device must be registered in `Biometric Device` with its hardware serial and `enabled=1` — unknown serials get HTTP 403.
          files: |
            dist/k40_bridge.exe
            k40_bridge/Output/K40BridgeSetup.exe
          make_latest: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
